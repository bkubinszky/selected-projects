baseURL: "https://bkubinszky.github.io/selected-projects/"
publishDir: "docs"
title: 'Balázs Kubinszky'
theme: 'fortyten'

defaultContentLanguage: de
defaultContentLanguageInSubdir: false

languages:
  de:
    contentDir: content/de
    label: Deutsch
    locale: de-de
    weight: 1
  en:
    contentDir: content/en
    label: English
    locale: en-us
    weight: 2

params:
  description: "Ausgewählte Projekte, Experimente und Use Cases"
  keywords: "Kubinszky, Blog"
  enableSiteSearch: false
  author:
    name: "Balázs Kubinszky"
    email: "balazs.kubinszky@gmail.com"
  social:
    github: "https://github.com/bkubinszky"
    linkedin: "https://www.linkedin.com/in/bkub/"
    email: "balazs.kubinszky@gmail.com"

build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css
    - source: '(postcss|tailwind)\.config\.js'
      target: css

module:
  mounts:
    - source: assets
      target: assets
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json